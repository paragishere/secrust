<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secrust | Setup Organization</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #fff8f5;
            color: #1e293b;
        }

        .card {
            width: 440px;
            padding: 40px;

            background: rgba(255,255,255,0.9);
            border: 1px solid #fed7cc;
            border-radius: 24px;

            box-shadow: 0 20px 50px rgba(255,120,80,0.12);
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #ff7657;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;

            border: 1px solid #e2e8f0;
            border-radius: 10px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff7657;
        }

        button {
            width: 100%;
            padding: 14px;

            border: 0;
            border-radius: 12px;

            background: #ff7657;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #ff6746;
        }

        .note {
            margin-top: 20px;
            padding: 12px;

            border-radius: 10px;
            background: #fff1ec;

            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🛡 Secrust</div>

    <h1>Setup Organization</h1>

    <div class="subtitle">
        Create your organization and the first
        <strong>Super Administrator</strong> account.
    </div>

    <form action="/setup" method="POST">

        <label>Organization Name</label>
        <input
            type="text"
            name="organization"
            placeholder="Company / Organization"
            required
        >

        <label>Administrator Name</label>
        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <label>Administrator Email</label>
        <input
            type="email"
            name="email"
            placeholder="admin@company.com"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Minimum 8 characters"
            required
        >

        <button type="submit">
            Create Organization
        </button>

    </form>

    <div class="note">
        This setup is available only for the initial
        Secrust installation. After an organization is
        created, new users must be invited by an administrator.
    </div>

</div>

</body>
</html>
