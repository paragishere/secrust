<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add User - Secrust</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<div class="container">

    <h1>👤 Add User</h1>

    <p>
        Create a user for your organization.
    </p>

    {{if .error}}

    <div class="alert danger">
        {{.error}}
    </div>

    {{end}}

    <form
        action="/users/add"
        method="POST"
    >

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Employee name"
                required
            >

        </div>

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="employee@company.com"
                required
            >

        </div>

        <div class="form-group">

            <label>
                Temporary Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

        </div>

        <div class="form-group">

            <label>
                Role
            </label>

            <select
                name="role"
                required
            >

                <option value="VIEWER">
                    Viewer
                </option>

                <option value="ANALYST">
                    Analyst
                </option>

                <option value="MANAGER">
                    Manager
                </option>

            </select>

        </div>

        <button
            type="submit"
            class="btn-primary"
        >
            Create User
        </button>

    </form>

    <br>

    <a href="/users">
        ← Back to Users
    </a>

</div>

</body>

</html>
