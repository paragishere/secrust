<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secrust | Invite User</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff8f5;
            color: #1e293b;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 440px;
            padding: 40px;

            background: white;
            border: 1px solid #fed7cc;
            border-radius: 22px;

            box-shadow: 0 20px 50px rgba(255,120,80,.12);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;

            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;

            border: 0;
            border-radius: 11px;

            background: #ff7657;
            color: white;

            font-weight: 700;
            font-size: 16px;

            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Invite User</h1>

    <p class="subtitle">
        Invite a team member to your Secrust organization.
    </p>

    <form action="/users/invite" method="POST">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="employee@company.com"
            required
        >

        <label>Role</label>

        <select name="role" required>

            <option value="VIEWER">
                Viewer
            </option>

            <option value="ANALYST">
                Analyst
            </option>

            <option value="MANAGER">
                Manager
            </option>

        </select>

        <button type="submit">
            Send Invitation
        </button>

    </form>

</div>

</body>
</html>
