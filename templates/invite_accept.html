<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Join Secrust</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #fff8f5;
            color: #1e293b;
        }

        .card {
            width: 440px;

            padding: 40px;

            background: white;

            border: 1px solid #fed7cc;

            border-radius: 22px;

            box-shadow:
                0 20px 50px rgba(255,120,80,.12);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;

            color: #ff7657;

            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 10px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .info {
            padding: 15px;

            background: #fff1ec;

            border-radius: 10px;

            margin-bottom: 25px;
        }

        .info div {
            margin: 6px 0;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #e2e8f0;

            border-radius: 10px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff7657;
        }

        button {
            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 11px;

            background: #ff7657;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="logo">
        🛡 Secrust
    </div>

    <h1>Join your organization</h1>

    <p class="subtitle">
        You have been invited to join a Secrust organization.
        Set your password to activate your account.
    </p>

    {{ if .error }}

    <div class="error">
        {{ .error }}
    </div>

    {{ end }}

    {{ if .email }}

    <div class="info">

        <div>
            <strong>Email:</strong>
            {{ .email }}
        </div>

        <div>
            <strong>Role:</strong>
            {{ .role }}
        </div>

    </div>

    <form
        action="/invite/{{ .token }}"
        method="POST"
    >

        <label>
            Your Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            value="{{ .name }}"
            required
        >

        <label>
            Create Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 8 characters"
            required
        >

        <button type="submit">
            Accept Invitation
        </button>

    </form>

    {{ end }}

</div>

</body>

</html>
